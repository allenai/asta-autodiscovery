name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # This build is purely for CI. The built images are not pushed anywhere.
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build containers
        run: docker compose build
        env:
          # These all need to be set for the build.
          GOOGLE_APPLICATION_CREDENTIALS: /dev/null
          GCS_BUCKET: ""
          GCP_PROJECT: ""
          GOOGLE_ACCESS_KEY_ID: ""
          GOOGLE_ACCESS_KEY_SECRET: ""

  # This build is purely for CI. It does not publish any artifacts.
  ui-build:
    name: UI Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

  # Runs the credential-free Python unit tests (the `not modal and not adc`
  # subset — everything that needs no Modal account or GCS/ADC credentials).
  # `make test` uses `uv run --all-packages`, so no secrets are required and it
  # is safe on PRs (including forks).
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    env:
      # Pin the interpreter (requires-python is >=3.13); uv installs it on demand.
      UV_PYTHON: "3.13"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run unit tests (credential-free subset)
        run: make test

  # Notify the private repo once, but only after the builds and unit tests
  # succeed on a push to main. `needs` guarantees this runs only on their success.
  notify-private:
    name: Process public main change
    needs: [docker-build, ui-build, unit-tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger workflow
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DISPATCH_TOKEN }}
        run: |
          # No --ref: dispatch against the private repo's default branch (its
          # trunk), which is where the submodule bump + deploy should land. This
          # follows the trunk automatically if the default branch ever changes.
          gh workflow run process-public-main-change.yml \
            --repo allenai/asta-autodiscovery-private --ref main
