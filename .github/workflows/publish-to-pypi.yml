name: Publish to PyPI
# See https://docs.pypi.org/trusted-publishers/ for how this is authenticated


on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  # asta-autodiscovery ships the HTML report's run view as package data, built
  # from ui/. It is built here, not in the publish job: yarn install runs the
  # install scripts of hundreds of npm packages, which must not share a job with
  # the PyPI publishing token.
  report-viewer:
    name: Build the HTML report's run view
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build report viewer
        working-directory: ui
        run: |
          yarn install --frozen-lockfile
          yarn build:report

      - name: Upload report viewer
        uses: actions/upload-artifact@v4
        with:
          name: report-viewer
          path: packages/autodiscovery/src/autodiscovery/report_viewer/
          if-no-files-found: error

  publish:
    name: Build and publish to PyPI
    needs: report-viewer
    runs-on: ubuntu-latest

    # Split from the release job below so neither token carries the other's
    # authority. These steps run third-party code -- each package's build
    # backend, and the publish action on a moving tag -- so this token must
    # not be able to write to the repo.
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read   # Required to checkout the repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}

      - name: Download report viewer
        uses: actions/download-artifact@v4
        with:
          name: report-viewer
          path: packages/autodiscovery/src/autodiscovery/report_viewer

      # Fail before anything is published, rather than ship a wheel whose runs
      # cannot render their report.
      - name: Check report viewer
        run: test -s packages/autodiscovery/src/autodiscovery/report_viewer/index.html

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Build asta-autodiscovery-modal
        run: uv build --package asta-autodiscovery-modal --out-dir dist/asta-autodiscovery-modal

      - name: Publish asta-autodiscovery-modal to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/asta-autodiscovery-modal
          print-hash: true

      - name: Build asta-code-execution
        run: uv build --package asta-code-execution --out-dir dist/asta-code-execution

      - name: Publish asta-code-execution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/asta-code-execution
          print-hash: true

      - name: Build asta-autodiscovery
        run: uv build --package asta-autodiscovery --out-dir dist/asta-autodiscovery

      - name: Check the wheel ships the report viewer
        run: unzip -l dist/asta-autodiscovery/*.whl | grep -q 'autodiscovery/report_viewer/index.html'

      - name: Publish asta-autodiscovery to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/asta-autodiscovery
          print-hash: true

  # PyPI renders only the current long description, so a GitHub release is the
  # only place per-version notes live and the only thing watchers can subscribe
  # to. Gated on publish, so a release cannot appear for a version that never
  # reached PyPI.
  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest

    # The only scope this job needs. No id-token, so it cannot reach PyPI.
    permissions:
      contents: write

    steps:
      # No checkout needed: gh works against the API given --repo, and the body
      # links the tag's CHANGELOG.md rather than reading it off disk.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          Published to PyPI: [asta-autodiscovery ${VERSION#v}](https://pypi.org/project/asta-autodiscovery/${VERSION#v}/)

          Release notes, including breaking changes: [CHANGELOG.md](https://github.com/$REPO/blob/$VERSION/CHANGELOG.md)
          EOF
          gh release create "$VERSION" \
            --repo "$REPO" \
            --title "$VERSION" \
            --verify-tag \
            --notes-file release-notes.md
