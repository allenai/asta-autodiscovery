version: v2
description: 'Four non-archaeology tasks selected from the 29-task dataset-complexity analysis: boxes (low), meta-regression-raw (high), conversation (high), and nls-raw (very high). One independent GRPO fmt3_pairs_related arm per dataset, one prompt, 10 epochs, group=256, binary belief-change surprise reward, failure reward 0, and explicit gpt-5-mini execution and belief models. Uses slime ba17b587 with the WandB compatibility patch, corrected Ray success guard, reward concurrency 32, high-memory preflight, minRuntime=1h, and 24h timeout.'
tasks:
  - name: boxes
    image:
      docker: slimerl/slime:latest
    command: [bash, -c, "set -ex\nMA=$(awk '/MemAvailable/{print int($2/1048576)}' /proc/meminfo)\necho \"[preflight] host MemAvailable=${MA}GiB (need >=600)\"\nif [ \"$MA\" -lt 600 ]; then echo \"[preflight] node too loaded - failing fast\"; exit 1; fi\nexport SPLIT_SUBDIR=\"task1_$1\"\ngit clone https://github.com/sijial430/slime.git /root/slime-repo\ncd /root/slime-repo\ngit checkout ba17b5870b878aa1535ee4681beff1d5a1ef525b\necho '[fix1] patching wandb.util.generate_id'\nfind /root/slime -name wandb_utils.py -exec sed -i 's/wandb\\.util\\.generate_id()/(getattr(wandb.util,\"generate_id\",None) or __import__(\"wandb.sdk.lib.runid\",fromlist=[\"generate_id\"]).generate_id)()/g' {} +\ngrep -rn 'generate_id' /root/slime --include=wandb_utils.py || true\necho '[fix2] making ray job failures propagate'\nexport AUTODS_RAY_SID=\"autods-$(date +%s)\"\nsed -i 's|ray job submit --address=\"http://127.0.0.1:8265\" \\\\|ray job submit --address=\"http://127.0.0.1:8265\" --submission-id \"$AUTODS_RAY_SID\" \\\\|' examples/autodiscovery_rl/train_grpo.sh\ngrep -q 'submission-id' examples/autodiscovery_rl/train_grpo.sh || { echo \"[guard] FAILED to patch ray submit\"; exit 1; }\nprintf '%s\\n' '' 'RC=$?' 'ST=$(ray job status --address=http://127.0.0.1:8265 \"$AUTODS_RAY_SID\" 2>&1 | tail -3)' 'echo \"[guard] ray submit rc=$RC ; final status: $ST\"' 'case \"$ST\" in *succeeded*|*SUCCEEDED*) exit \"$RC\" ;; *) echo \"[guard] ray job did NOT reach SUCCEEDED\"; exit 1 ;; esac' >> examples/autodiscovery_rl/train_grpo.sh\nbash examples/autodiscovery_rl/beaker_fmt_ablation_entry.sh\n", _, boxes]
    envVars:
      - name: FORMAT
        value: fmt3_pairs_related
      - name: ADVANTAGE_ESTIMATOR
        value: grpo
      - name: LR
        value: "5e-6"
      - name: KL_COEF
        value: "0.01"
      - name: EPOCHS
        value: "10"
      - name: REWARD_SIGNAL
        value: belief_change
      - name: ROLLOUT_BATCH_SIZE
        value: "1"
      - name: N_SAMPLES_PER_PROMPT
        value: "256"
      - name: MAX_PROMPT_LEN
        value: "8192"
      - name: EXECUTION_MODEL
        value: gpt-5-mini
      - name: BELIEF_MODEL
        value: gpt-5-mini
      - name: AUTODS_USE_BINARY_REWARD
        value: "true"
      - name: REWARD_CONCURRENCY
        value: "32"
      - name: WANDB_KEY
        secret: SIJIAL_WANDB_API_KEY
      - name: OPENAI_API_KEY
        secret: OPENAI_API_KEY
      - name: AWS_ACCESS_KEY_ID
        secret: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secret: AWS_SECRET_ACCESS_KEY
      - name: GITHUB_TOKEN
        secret: SIJIAL_AI2_GH_TOKEN
      - name: HF_TOKEN
        secret: HF_TOKEN
    result:
      path: /results
    resources:
      gpuCount: 8
      memory: 1000 GiB
    context:
      priority: urgent
      minRuntime: 1h0m0s
      autoResume: true
    constraints:
      cluster:
        - ai2/jupiter
    hostNetworking: false
    propagateFailure: false
    propagatePreemption: false
    timeout: 24h0m0s
