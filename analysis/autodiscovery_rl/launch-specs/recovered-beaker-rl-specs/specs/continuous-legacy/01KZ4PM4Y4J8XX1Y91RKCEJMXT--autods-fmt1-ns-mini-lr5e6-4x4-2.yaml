version: v2
tasks:
  - name: main
    image:
      docker: slimerl/slime:latest
    command: [bash, /gantry/entrypoint.sh]
    arguments: [bash, examples/autodiscovery_rl/beaker_fmt_ablation_entry.sh]
    envVars:
      - name: GANTRY_VERSION
        value: 1.17.2
      - name: GITHUB_REPO
        value: sijial430/slime
      - name: GIT_REF
        value: 92f258c7acaf37fe5401e3834275664594b10d54
      - name: GANTRY_TASK_NAME
        value: main
      - name: RESULTS_DIR
        value: /results
      - name: CONDA_PLUGINS_AUTO_ACCEPT_TOS
        value: "yes"
      - name: FORMAT
        value: fmt1_hyps_open
      - name: EPOCHS
        value: "3"
      - name: REWARD_SIGNAL
        value: norm_surprisal
      - name: EXECUTION_MODEL
        value: gpt-5-mini
      - name: LR
        value: "5e-6"
      - name: ROLLOUT_BATCH_SIZE
        value: "4"
      - name: N_SAMPLES_PER_PROMPT
        value: "4"
      - name: WANDB_GROUP
        value: norm_surprisal-fmt1-mini-lr5e6-4x4
      - name: WANDB_KEY
        secret: SIJIAL_WANDB_API_KEY
      - name: OPENAI_API_KEY
        secret: OPENAI_API_KEY
      - name: AWS_ACCESS_KEY_ID
        secret: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secret: AWS_SECRET_ACCESS_KEY
      - name: GITHUB_TOKEN
        secret: SIJIAL_AI2_GH_TOKEN
      - name: HF_TOKEN
        secret: HF_TOKEN
      - name: NO_PYTHON
        value: "1"
    datasets:
      - mountPath: /gantry
        source:
          beaker: 01KVY7GT81R5YZ3ZH6RCDV8GKP
    result:
      path: /results
    resources:
      gpuCount: 8
    context:
      priority: urgent
      minRuntime: 0s
      autoResume: true
    constraints:
      cluster:
        - ai2/jupiter
    hostNetworking: false
    propagateFailure: false
    propagatePreemption: false
