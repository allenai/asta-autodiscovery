version: v2
tasks:
  - name: main
    image:
      docker: slimerl/slime:latest
    command: [bash, /gantry/entrypoint.sh]
    arguments: [bash, -lc, cp -R /fmt1-overlay/. . && bash examples/autodiscovery_rl/run_fmt1_stable.sh]
    envVars:
      - name: GANTRY_VERSION
        value: 1.17.2
      - name: GITHUB_REPO
        value: sijial430/slime
      - name: GIT_REF
        value: 0cd5cda8
      - name: GANTRY_TASK_NAME
        value: main
      - name: RESULTS_DIR
        value: /results
      - name: CONDA_PLUGINS_AUTO_ACCEPT_TOS
        value: "yes"
      - name: ASTA_REF
        value: sijia/generator-dev
      - name: FORMAT
        value: fmt1_hyps_open
      - name: EPOCHS
        value: "1"
      - name: REWARD_SIGNAL
        value: norm_surprisal
      - name: EXECUTION_MODEL
        value: gpt-5-mini
      - name: LR
        value: "5e-6"
      - name: KL_COEF
        value: "0.03"
      - name: ROLLOUT_BATCH_SIZE
        value: "4"
      - name: N_SAMPLES_PER_PROMPT
        value: "4"
      - name: MAX_RESPONSE_LEN
        value: "16384"
      - name: INCLUDE_EXEC_LOG
        value: "0"
      - name: AUTODISCOVERY_LENGTH_COEF
        value: "0.05"
      - name: WANDB_GROUP
        value: fmt1-stable-length-treatment-lr5e6-kl03
      - name: WANDB_KEY
        secret: SIJIAL_WANDB_API_KEY
      - name: OPENAI_API_KEY
        secret: OPENAI_API_KEY
      - name: AWS_ACCESS_KEY_ID
        secret: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secret: AWS_SECRET_ACCESS_KEY
      - name: GITHUB_TOKEN
        secret: SIJIAL_AI2_GH_TOKEN
      - name: HF_TOKEN
        secret: HF_TOKEN
      - name: NO_PYTHON
        value: "1"
    datasets:
      - mountPath: /gantry
        source:
          beaker: 01KVY7GT81R5YZ3ZH6RCDV8GKP
      - mountPath: /fmt1-overlay
        source:
          beaker: 01KZ71T7FZK57GC4YVCM1REA98
    result:
      path: /results
    resources:
      gpuCount: 8
    context:
      priority: urgent
      minRuntime: 0s
      autoResume: true
    constraints:
      cluster:
        - ai2/titan
        - ai2/jupiter
        - ai2/ceres
        - ai2/neptune
        - ai2/saturn
    hostNetworking: false
    propagateFailure: false
    propagatePreemption: false
    timeout: 24h0m0s
