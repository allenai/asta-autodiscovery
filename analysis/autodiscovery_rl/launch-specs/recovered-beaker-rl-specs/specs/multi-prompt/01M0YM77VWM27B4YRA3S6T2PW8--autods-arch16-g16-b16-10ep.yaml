version: v2
description: 'archaeology multi-prompt: GRPO fmt3_pairs_related (v2 data), 16 archaeology prompts x group 16 (global batch 256), 10 epochs, binary surprise reward. slime ba17b587.'
tasks:
  - name: main
    image:
      docker: slimerl/slime:latest
    command: [bash, -c, 'set -e; git clone https://github.com/sijial430/slime.git /root/slime-repo; cd /root/slime-repo; git checkout ba17b5870b878aa1535ee4681beff1d5a1ef525b; bash examples/autodiscovery_rl/beaker_fmt_ablation_entry.sh']
    envVars:
      - name: SPLIT_SUBDIR
        value: arch16_fmt3
      - name: FORMAT
        value: fmt3_pairs_related
      - name: ADVANTAGE_ESTIMATOR
        value: grpo
      - name: LR
        value: "5e-6"
      - name: KL_COEF
        value: "0.01"
      - name: EPOCHS
        value: "10"
      - name: REWARD_SIGNAL
        value: belief_change
      - name: ROLLOUT_BATCH_SIZE
        value: "16"
      - name: N_SAMPLES_PER_PROMPT
        value: "16"
      - name: GLOBAL_BATCH_SIZE
        value: "256"
      - name: MAX_PROMPT_LEN
        value: "8192"
      - name: EXECUTION_MODEL
        value: gpt-5-mini
      - name: AUTODS_USE_BINARY_REWARD
        value: "true"
      - name: AUTODISCOVERY_FAILURE_REWARD
        value: "-1"
      - name: WANDB_KEY
        secret: SIJIAL_WANDB_API_KEY
      - name: OPENAI_API_KEY
        secret: OPENAI_API_KEY
      - name: AWS_ACCESS_KEY_ID
        secret: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secret: AWS_SECRET_ACCESS_KEY
      - name: GITHUB_TOKEN
        secret: SIJIAL_AI2_GH_TOKEN
      - name: HF_TOKEN
        secret: HF_TOKEN
    result:
      path: /results
    resources:
      gpuCount: 8
    context:
      priority: urgent
      minRuntime: 0s
      autoResume: true
    constraints:
      cluster:
        - ai2/jupiter
    hostNetworking: false
    propagateFailure: false
    propagatePreemption: false
    timeout: 12h0m0s
