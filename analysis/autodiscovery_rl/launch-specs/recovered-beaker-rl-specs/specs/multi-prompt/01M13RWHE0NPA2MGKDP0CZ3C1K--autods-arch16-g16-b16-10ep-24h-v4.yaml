version: v2
description: 'GRPO fmt3_pairs_related: 16 archaeology prompts x group 16, 10 epochs, binary reward, 24h. slime ba17b587 + wandb/ray/mem fixes.'
tasks:
  - name: main
    image:
      docker: slimerl/slime:latest
    command: [bash, -c, 'set -e; export AUTODS_RAY_SID="autods-$(date +%s)"; git clone https://github.com/sijial430/slime.git /root/slime-repo; cd /root/slime-repo; git checkout ba17b5870b878aa1535ee4681beff1d5a1ef525b; echo ''[fix1] patching wandb.util.generate_id (removed in current wandb)''; find /root/slime -name wandb_utils.py -exec sed -i ''s/wandb\.util\.generate_id()/(getattr(wandb.util,"generate_id",None) or __import__("wandb.sdk.lib.runid",fromlist=["generate_id"]).generate_id)()/g'' {} + ; grep -rn ''generate_id'' /root/slime --include=wandb_utils.py || true; echo ''[fix2] making ray job failures propagate''; sed -i ''s|ray job submit --address="http://127.0.0.1:8265" \\|ray job submit --address="http://127.0.0.1:8265" --submission-id "$AUTODS_RAY_SID" \\|'' examples/autodiscovery_rl/train_grpo.sh ; grep -q ''submission-id'' examples/autodiscovery_rl/train_grpo.sh || { echo ''[guard] FAILED to patch ray submit''; exit 1; } ; printf ''%s\n'' '''' ''RC=$?'' ''ST=$(ray job status --address=http://127.0.0.1:8265 "$AUTODS_RAY_SID" 2>&1 | tail -3)'' ''echo "[guard] ray submit rc=$RC ; final status: $ST"'' ''case "$ST" in *SUCCEEDED*) exit "$RC" ;; *) echo "[guard] ray job did NOT reach SUCCEEDED - failing job"; exit 1 ;; esac'' >> examples/autodiscovery_rl/train_grpo.sh; bash examples/autodiscovery_rl/beaker_fmt_ablation_entry.sh']
    envVars:
      - name: SPLIT_SUBDIR
        value: arch16_fmt3
      - name: FORMAT
        value: fmt3_pairs_related
      - name: ADVANTAGE_ESTIMATOR
        value: grpo
      - name: LR
        value: "5e-6"
      - name: KL_COEF
        value: "0.01"
      - name: EPOCHS
        value: "10"
      - name: REWARD_SIGNAL
        value: belief_change
      - name: ROLLOUT_BATCH_SIZE
        value: "16"
      - name: N_SAMPLES_PER_PROMPT
        value: "16"
      - name: GLOBAL_BATCH_SIZE
        value: "256"
      - name: MAX_PROMPT_LEN
        value: "8192"
      - name: EXECUTION_MODEL
        value: gpt-5-mini
      - name: REWARD_CONCURRENCY
        value: "32"
      - name: AUTODS_USE_BINARY_REWARD
        value: "true"
      - name: AUTODISCOVERY_FAILURE_REWARD
        value: "-1"
      - name: WANDB_KEY
        secret: SIJIAL_WANDB_API_KEY
      - name: OPENAI_API_KEY
        secret: OPENAI_API_KEY
      - name: AWS_ACCESS_KEY_ID
        secret: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        secret: AWS_SECRET_ACCESS_KEY
      - name: GITHUB_TOKEN
        secret: SIJIAL_AI2_GH_TOKEN
      - name: HF_TOKEN
        secret: HF_TOKEN
    result:
      path: /results
    resources:
      gpuCount: 8
      memory: 1000 GiB
    context:
      priority: urgent
      minRuntime: 0s
      autoResume: true
    constraints:
      cluster:
        - ai2/jupiter
    hostNetworking: false
    propagateFailure: false
    propagatePreemption: false
    timeout: 24h0m0s
