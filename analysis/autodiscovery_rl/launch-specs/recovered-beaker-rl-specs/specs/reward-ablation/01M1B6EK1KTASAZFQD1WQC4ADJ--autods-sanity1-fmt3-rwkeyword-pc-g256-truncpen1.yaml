version: "v2"
description: "autods-sanity1-fmt3-rwkeyword-pc-g256-truncpen1"
tasks:
  -
    name: "main"
    image:
      docker: "slimerl/slime:latest"
    command:
      - "bash"
      - "-c"
      - "set -e; git clone https://github.com/sijial430/slime.git /root/slime-repo; cd /root/slime-repo; git checkout c391fd034025ea946847599d61a81c7243c22474; git apply --check /patch/keyword-truncpen1.patch; git apply /patch/keyword-truncpen1.patch; AUTODISCOVERY_FAILURE_REWARD=-1.0 python3 /patch/verify_keyword_penalty.py; bash examples/autodiscovery_rl/beaker_fmt_ablation_entry.sh"
    envVars:
      -
        name: "SPLIT_SUBDIR"
        value: "sanity1_fmt3_bin"
      -
        name: "FORMAT"
        value: "fmt3_w_verdict"
      -
        name: "ADVANTAGE_ESTIMATOR"
        value: "grpo"
      -
        name: "LR"
        value: "5e-6"
      -
        name: "KL_COEF"
        value: "0.01"
      -
        name: "EPOCHS"
        value: "10"
      -
        name: "REWARD_SIGNAL"
        value: "norm_surprisal"
      -
        name: "ROLLOUT_BATCH_SIZE"
        value: "1"
      -
        name: "N_SAMPLES_PER_PROMPT"
        value: "256"
      -
        name: "MAX_PROMPT_LEN"
        value: "8192"
      -
        name: "EXECUTION_MODEL"
        value: "gpt-5-mini"
      -
        name: "WANDB_KEY"
        secret: "SIJIAL_WANDB_API_KEY"
      -
        name: "OPENAI_API_KEY"
        secret: "OPENAI_API_KEY"
      -
        name: "AWS_ACCESS_KEY_ID"
        secret: "AWS_ACCESS_KEY_ID"
      -
        name: "AWS_SECRET_ACCESS_KEY"
        secret: "AWS_SECRET_ACCESS_KEY"
      -
        name: "GITHUB_TOKEN"
        secret: "SIJIAL_AI2_GH_TOKEN"
      -
        name: "HF_TOKEN"
        secret: "HF_TOKEN"
      -
        name: "REWARD_TYPE"
        value: "keyword"
      -
        name: "AUTODISCOVERY_KEYWORD_PATTERN"
        value: "(?s)(?=.*pottery\\s*form)(?=.*copper)"
      -
        name: "AUTODISCOVERY_FAILURE_REWARD"
        value: "-1.0"
    datasets:
      -
        mountPath: "/patch"
        source:
          beaker: "01M1B6DP4V3G71QJZYV4QEW5RE"
    result:
      path: "/results"
    resources:
      gpuCount: 8
    context:
      priority: "urgent"
      minRuntime: "0s"
      autoResume: true
    constraints:
      cluster:
        - "ai2/jupiter"
    hostNetworking: false
    propagateFailure: false
    propagatePreemption: false
    timeout: "16h0m0s"
