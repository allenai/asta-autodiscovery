<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>Surprise-reward run — live reward monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#eef1f4;--panel:#fff;--ink:#1a2230;--muted:#5b6675;--hair:#d6dce4;--hair2:#e9edf1;

  @media (prefers-color-scheme:dark){:root{--bg:#0d1118;--panel:#161c26;--ink:#e6ebf2;--muted:#95a2b6;--hair:#2a3342;--hair2:#20272f;--ns:#54c2c2;--ns-soft:#123030;--ns-ink:#8fdcdc;--bc:#e0a24a;--bc-soft:#2c2413;--bc-ink:#f0c483;--run:#5cc389;--fail:#e0785f;--start:#e0b45a}}

  :root[data-theme="dark"]{--bg:#0d1118;--panel:#161c26;--ink:#e6ebf2;--muted:#95a2b6;--hair:#2a3342;--hair2:#20272f;--ns:#54c2c2;--ns-soft:#123030;--ns-ink:#8fdcdc;--bc:#e0a24a;--bc-soft:#2c2413;--bc-ink:#f0c483;--run:#5cc389;--fail:#e0785f;--start:#e0b45a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:clamp(18px,3.5vw,40px)}

  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
  h1{font-size:clamp(21px,3vw,29px);margin:0;letter-spacing:-.02em;font-weight:680}
  .asof{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
  .asof b{color:var(--ink)}
  .summ{display:flex;gap:26px;flex-wrap:wrap;margin:18px 0 8px;padding:14px 18px;background:var(--panel);border:1px solid var(--hair);border-radius:11px}

  @media(min-width:960px){.grid{grid-template-columns:1fr 1fr 1fr}}

  .card.bc{--sig:var(--bc);--sigsoft:var(--bc-soft);--sigink:var(--bc-ink)}
  .ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .st .v.sig{color:var(--sig)}

  .lab{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 4px;display:flex;justify-content:space-between}

  .sp{flex:1;background:var(--sig);border-radius:1px;min-height:1px;opacity:.8}
  .hist{display:flex;align-items:flex-end;gap:1.5px;height:34px;margin-top:2px}
  .hb{flex:1;background:var(--sig);border-radius:1px 1px 0 0;min-height:1px;opacity:.55}
  .ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;color:var(--muted);margin-top:2px}
  .foot{margin-top:34px;padding-top:15px;border-top:1px solid var(--hair);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
</style>

const ASOF = "2026-07-31 09:10 UTC";
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
document.getElementById('asof').textContent=ASOF;

const totalN=DATA.reduce((s,j)=>s+j.n,0);
const running=DATA.filter(j=>j.status==='run').length;
const failed=DATA.filter(j=>j.status==='fail').length;
document.getElementById('summ').innerHTML=
  `<div><div class="v">${DATA.length}</div><div class="k">jobs</div></div>`+
  `<div><div class="v" style="color:var(--run)">${running}</div><div class="k">running</div></div>`+
  (failed?`<div><div class="v" style="color:var(--fail)">${failed}</div><div class="k">failed</div></div>`:'')+
  `<div><div class="v">${totalN.toLocaleString()}</div><div class="k">reward records</div></div>`+
  `<div><div class="v">${Math.round(totalN/64)}</div><div class="k">≈ steps total</div></div>`;

function card(j){
  const a=j.reward_signal==='norm_surprisal'?'ns':'bc';
  const c=el('div','card '+a);
  const stat=j.status||'run';
  c.appendChild(el('div','ch',
    `<span class="tag">${j.tag}</span><span class="pill ${stat}">${stat}</span><span class="badge">${j.reward_signal}</span>`));
  c.appendChild(el('div','cf',j.format));
  c.appendChild(el('div','st',
    `<div><div class="v sig">${j.reward_mean}</div><div class="k">rew mean</div></div>`+
    `<div><div class="v">${j.reward_max}</div><div class="k">rew max</div></div>`+
    `<div><div class="v">${Math.round(j.success_rate*100)}%</div><div class="k">exp ok</div></div>`+
    `<div><div class="v">${j.n}</div><div class="k">records</div></div>`+
    `<div><div class="v">~${j.step_est}</div><div class="k">step</div></div>`));
  // per-step reward-mean trend (the pre-eval learning signal)
  if (j.trend && j.trend.length>1){
    const t=j.trend, lo=Math.min(...t), h2=Math.max(...t), rng=(h2-lo)||1, d0=t[t.length-1]-t[0];
    c.appendChild(el('div','lab',`<span>reward / step (mean)</span><span>${t.length} steps · Δ${d0>=0?'+':''}${d0.toFixed(2)}</span>`));
    const W=100,H=30,pts=t.map((v,i)=>`${(i/(t.length-1)*W).toFixed(1)},${(H-((v-lo)/rng)*H).toFixed(1)}`).join(' ');
    const holder=el('div');
    holder.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:32px;display:block;overflow:visible">`+
      `<polyline points="${pts}" fill="none" stroke="var(--sig)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`+
      `<circle cx="${W}" cy="${(H-((t[t.length-1]-lo)/rng)*H).toFixed(1)}" r="2.2" fill="var(--sig)"/></svg>`;
    c.appendChild(holder);
    c.appendChild(el('div','ax',`<span>${lo.toFixed(2)}</span><span>${h2.toFixed(2)}</span>`));
  }
  // recent reward sparkline
  c.appendChild(el('div','lab',`<span>recent rewards (last ${j.recent.length})</span><span>0–${j.hi}</span>`));
  const sp=el('div','spark');
  j.recent.forEach(v=>{const b=el('div','sp');b.style.height=Math.max(3,100*Math.min(v,j.hi)/j.hi)+'%';b.title=v;if(v===0)b.style.opacity=.25;sp.appendChild(b);});
  c.appendChild(sp);
  // histogram
  c.appendChild(el('div','lab',`<span>distribution</span><span>mean ${j.reward_mean}</span>`));
  const mx=Math.max(...j.hist,1), h=el('div','hist');
  j.hist.forEach(v=>{const b=el('div','hb');b.style.height=(100*v/mx)+'%';h.appendChild(b);});
  c.appendChild(h);
  c.appendChild(el('div','ax',a==='bc'?'<span>0</span><span>1.5</span><span>3</span>':'<span>0</span><span>0.5</span><span>1</span>'));
  return c;
}
const gns=document.getElementById('gns'), gbc=document.getElementById('gbc');
DATA.filter(j=>j.reward_signal==='norm_surprisal').forEach(j=>gns.appendChild(card(j)));
DATA.filter(j=>j.reward_signal==='belief_change').forEach(j=>gbc.appendChild(card(j)));

document.getElementById('foot').textContent=
  'reward = server-scored Bayesian surprise · normalized_surprisal ≈[0,1] · belief_change=|Δbelief|/0.2 (can exceed 1) · faded bars = failed experiments (reward 0) · refresh the page for the latest republish';
</script>
