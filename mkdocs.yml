site_name: AutoDiscovery
site_url: https://allenai.github.io/asta-autodiscovery
theme:
  name: material
  palette:
    - scheme: asta-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: asta-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
  font:
    text: Manrope
    code: JetBrains Mono
  logo: assets/images/asta-logo.svg
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/code_execution/src
            - packages/agents/src
            - packages/autodiscovery/src
            - packages/autodiscovery_modal/src
            - packages/autodiscovery_jobs/src
          options:
            docstring_options:
              # Much of the code is unannotated; don't fail strict builds on it.
              warn_missing_types: false

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Configuration: configuration.md
  - Authentication: authentication.md
  - Autodiscovery:
      - How It Works: autodiscovery/overview.md
      - Hypothesis Generation: autodiscovery/hypothesis_generation.md
      - Tree Search: autodiscovery/tree_search.md
      - Surprisal: autodiscovery/surprisal.md
      - Surprisal Normalization (derivation): autodiscovery/surprisal_normalization.md
      - Standalone CLI: autodiscovery/standalone.md
  - Code Execution:
      - IPython Session: code_execution/ipython_session.md
      - IPython Executor: code_execution/ipython_executor.md
  - Modal:
      - Sandbox Backend: autodiscovery_modal/sandbox_backend.md
  - API Reference:
      - AutoDiscovery: api/autodiscovery.md
      - AutoDiscovery Modal: api/autodiscovery_modal.md
      - Code Execution: api/code_execution.md
  - Design:
      - System Architecture: design/architecture.md
      - Swappable Auth Providers: design/auth-providers.md
      - Swappable Persistence Backends: design/storage-backends.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/styles/asta.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
