server {
    listen [::]:8080;
    listen 8080;

    access_log off;

    charset utf-8;

    expires -1;

    location / {
        proxy_set_header    X-Forwarded-Host    $http_host;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_set_header    X-Forwarded-Port    $server_port;
        proxy_set_header    X-Forwarded-For     $remote_addr;
        proxy_set_header    Host                $http_host;

        proxy_pass http://ui:3000;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /api {
        # Dataset uploads go through the API when the storage backend cannot issue
        # presigned URLs (STORAGE_BACKEND=local, the default). The API enforces the
        # real per-user size limit, so this only needs to not be the binding one.
        client_max_body_size 500m;

        proxy_set_header    X-Forwarded-Host    $http_host;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_set_header    X-Forwarded-Port    $server_port;
        proxy_set_header    X-Forwarded-For     $remote_addr;

        proxy_pass http://api:8000;
    }

}
